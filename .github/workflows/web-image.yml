# Publishes the web (PWA) image to GHCR. Only runs on a `web-v*` tag or manually.
name: web-image

on:
  push:
    tags: ["web-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The version comes from web/package.json; a release tag must agree with it.
      - id: version
        run: |
          version="$(node -p "require('./web/package.json').version")"
          if [[ "$GITHUB_REF" == refs/tags/web-v* && "$GITHUB_REF_NAME" != "web-v${version}" ]]; then
            echo "tag $GITHUB_REF_NAME does not match web/package.json version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/wristcall-web
          tags: |
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/web-v') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/web-v') }}
            type=sha
      - uses: docker/build-push-action@v7
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
