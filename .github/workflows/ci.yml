name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e 'server[dev]'
      - run: pytest -q
        working-directory: server
      - run: pip install -e tools/refclient
      - run: pytest -q tests
        working-directory: tools/refclient
      # The image's own SQLite (Debian) must have FTS5 and run the migrations: the host Python above is not the image.
      - name: Docker image opens a database
        run: |
          docker build -t wristcall-ci server
          docker run --rm --entrypoint python wristcall-ci -c "from wristcall.storage import open_sqlite_storage; print('schema', open_sqlite_storage(':memory:').db.version)"

  cloud:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8
        ports: ["27017:27017"]
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q
        env:
          WRISTCALL_CLOUD_TEST_MONGO_URL: mongodb://localhost:27017
      - run: docker build -t wristcall-cloud-ci .

  directory:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: directory
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
      - run: npm test
