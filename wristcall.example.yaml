# Example wristcall config. Copy to wristcall.yaml and adjust.
# ${VAR} values come from the container environment (see docker-compose.example.yml).
server:
  public_url: https://${WRISTCALL_DOMAIN}
  directory_url: https://wristcall-pair.trigram.com.br   # the project's public directory; delete the line to type the URL on the watch
  pairing_approval: code        # code: only the code from `wristcall pair` | manual: accepts requests and approves them in the CLI
  data_dir: /data

# Central account (wristcall Cloud, OIDC). Optional: without it the server works on its own.
# Apps exchange their login for a token made for this server only (its URL below), signed by the Cloud.
# central_account:
#   issuer: https://cloud.wristcall.example        # the wristcall Cloud API
#   audience: ["https://wristcall.example.com"]    # this server's URL(s), exactly as apps reach it
#   clients: ["<watch client id>", "<iOS client id>", "<PWA client id>"]   # optional
#   device_credential: approval   # approval (you approve each new device) | attestation (any linked login pairs)

# Push through the wristcall Cloud relay: the watch gets a check failure when a one-way call ends, management apps
# get device approval requests. Devices and apps register their own relay key; nothing else is set here.
# push:
#   relay_url: https://cloud.wristcall.example

# Call history (optional): how long calls stay and whether their text is encrypted at rest.
# history:
#   default_retention_days: 90     # agents without their own retention_days; absent = keep until deleted
#   max_retention_days: 365        # ceiling for every agent ("forever" included)
#   encryption_key: ${WRISTCALL_HISTORY_KEY}   # `wristcall history new-key`; losing it loses the history

providers:
  openai-stt:
    type: openai_stt
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    model: whisper-1
  openai-chat:
    type: openai_chat
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    model: ${CHAT_MODEL}
  openai-tts:
    type: openai_tts
    base_url: https://api.openai.com/v1
    api_key: ${OPENAI_API_KEY}
    model: tts-1
    voice: alloy
  # Fake providers: exercise the whole call without any API key.
  demo-stt:
    type: fake_stt
    text: hello
  demo-chat:
    type: echo_chat
  demo-tts:
    type: tone_tts

limits:
  max_agents_per_user: 20
  max_devices_per_user: 10
  custom_endpoints: true        # agents may use their own STT/chat/TTS URLs; false = only the providers above
  # custom_endpoint_types: [openai_stt, openai_chat, openai_tts, webhook]   # provider types a custom endpoint may use
  # max_one_way_call_s: 1800     # longest one-shot or monologue call

# Imported once as agents of the user `owner` on the first start (default first), then ignored.
# Manage agents afterwards with `wristcall agents ...`.
profiles:
  default:
    display_name: Agent
    language: en
    stt: openai-stt
    responder: openai-chat
    tts: openai-tts
    system_prompt: |
      You are a voice assistant. Answer in short sentences, with no lists or formatting,
      because everything is read aloud.
  demo:
    display_name: Demo
    stt: demo-stt
    responder: demo-chat
    tts: demo-tts
