# Security headers of every response. nginx does not inherit add_header into a location that has its own,
# so default.conf includes this file in the server block and again in each such location (a test checks it).
# Same as csp.json (used by `vite preview`, so the e2e run); a test checks that they are equal.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
