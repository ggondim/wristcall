# The server block of the image (the rest of nginx.conf is the unprivileged image's own: pid and temp paths under /tmp).
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

    include /etc/nginx/security-headers.conf;

    # Written at start by 40-wristcall-config.sh.
    location = /config.json {
        alias /tmp/wristcall/config.json;
        default_type application/json;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security-headers.conf;
    }

    # Hashed file names. A missing chunk must be a 404, never index.html with a 200. The Cache-Control has no
    # `always`, so it is not sent with the 404 (a browser would keep a failed chunk for a year).
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    location /icons/ {
        try_files $uri =404;
        include /etc/nginx/security-headers.conf;
    }

    # Routes of the app: index.html (served by the exact location above, with its own headers).
    location / {
        try_files $uri /index.html;
    }
}
